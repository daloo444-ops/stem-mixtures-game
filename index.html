<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدي مهندسة المخاليط | STEM</title><style>body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(circle at 20% 10%,#214e67,#0a1b32 65%);color:#fff;min-height:100vh;display:grid;place-items:center}main{width:min(570px,90vw);padding:22px;border:1px solid #54758b;border-radius:24px;background:#102941;box-shadow:0 18px 50px #0005}h1{text-align:center;color:#ffe19c;font-size:clamp(23px,5vw,34px);margin:10px 0}header p{text-align:center;color:#cfe1f4}.bar{height:10px;background:#32485f;border-radius:30px;overflow:hidden}.fill{height:100%;width:0;background:#e4b858;transition:.3s}.meta{display:flex;justify-content:space-between;margin:18px 0;color:#ffd98a}.domain{text-align:center;color:#abdbf5}h2{text-align:center;font-size:clamp(19px,4vw,25px);line-height:1.7;min-height:66px}button{font:inherit;cursor:pointer}button.opt{display:block;width:100%;text-align:right;background:#1c3b55;border:1px solid #55718a;color:white;padding:15px;border-radius:13px;margin:10px 0;line-height:1.5}button.opt:disabled{cursor:default;opacity:1}.opt.good{border-color:#6ee7a8;background:#135644}.opt.bad{border-color:#fb8c8c;background:#733444}.feedback{background:#1b3850;padding:13px;border-radius:12px;line-height:1.8;margin-top:14px}.next{width:100%;border:0;background:#eac36e;color:#192638;border-radius:12px;padding:15px;font-weight:800;margin-top:14px}.hidden{display:none}.final{text-align:center;line-height:1.8}.big{font-size:60px}footer{text-align:center;color:#9fc0d7;font-size:12px;margin-top:16px}</style></head><body><main><header><h1>🏆 تحدي مهندسة المخاليط</h1><p>اكتشفي • فكري • اختبري • ابتكري</p></header><div class="bar"><div id="fill" class="fill"></div></div><div class="meta"><span id="count">السؤال ١ من ٦</span><span id="points">⭐ ٠ نقطة</span></div><section id="game"><div class="domain" id="domain"></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="next hidden">السؤال التالي ←</button></section><section class="final hidden" id="final"><div class="big">🏆</div><h2 id="award"></h2><h1 id="result"></h1><p id="message"></p><button class="next" onclick="restart()">🔄 ابدئي تحديًا جديدًا</button></section><footer>مشروع STEM | العلوم – الصف الأول المتوسط</footer></main><script>const qs=[{q:'أي المخاليط التالية يُعد مخلوطًا متجانسًا؟',a:['الماء والرمل','الماء والملح بعد الذوبان','الماء والزيت'],c:1,d:'🔬 العلوم',e:'لأن الملح يذوب ويتوزع بانتظام في الماء.'},{q:'خلطت مهندستنا الرمل بالماء، ما نوع المخلوط الناتج؟',a:['متجانس','مادة نقية','غير متجانس'],c:2,d:'🔬 العلوم',e:'لأن حبيبات الرمل يمكن تمييزها عن الماء.'},{q:'ما الأداة المناسبة لفصل الرمل عن الماء؟',a:['المرشح','المغناطيس','الميزان'],c:0,d:'🛠️ الهندسة',e:'الترشيح يفصل الجسيمات الصلبة غير الذائبة عن السائل.'},{q:'صورت الطالبة تجربتها بالجوال لعرض خطواتها. أي مجال من STEM استخدمت؟',a:['الرياضيات','التقنية','العلوم فقط'],c:1,d:'📱 التقنية',e:'التصوير الرقمي لعرض التجربة من تطبيقات التقنية.'},{q:'دخل إلى المرشح 100 مل من المخلوط، وجُمِع بعد الترشيح 80 مل. ما الفرق؟',a:['20 مل','80 مل','180 مل'],c:0,d:'🔢 الرياضيات',e:'100 − 80 = 20 مل، وقد يبقى جزء من الماء داخل المرشح.'},{q:'أي تصرف يُظهر التفكير الهندسي لتحسين المرشح؟',a:['إيقاف التجربة دون اختبار','إضافة طبقة قطن ثم إعادة الاختبار','شرب الماء بعد الترشيح'],c:1,d:'🛠️ الهندسة',e:'الهندسة تعتمد على التصميم والاختبار والتحسين. والماء المرشح غير صالح للشرب.'}];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){$('count').textContent=`السؤال ${i+1} من ٦`;$('points').textContent=`⭐ ${score} نقطة`;$('fill').style.width=`${i/qs.length*100}%`;$('domain').textContent=qs[i].d;$('question').textContent=qs[i].q;$('options').innerHTML='';$('feedback').classList.add('hidden');$('next').classList.add('hidden');answered=false;qs[i].a.forEach((a,j)=>{let b=document.createElement('button');b.className='opt';b.textContent='أبج'[j]+' - '+a;b.onclick=()=>choose(j);$('options').appendChild(b)})}function choose(j){if(answered)return;answered=true;let q=qs[i];if(j===q.c)score++;[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('good');else if(k===j)b.classList.add('bad')});$('points').textContent=`⭐ ${score} نقطة`;$('feedback').textContent=(j===q.c?'🎉 أحسنتِ يا مهندسة! ':'💡 تعلمي الإجابة الصحيحة: ')+q.e;$('feedback').classList.remove('hidden');$('next').textContent=i===5?'شاهدي وسامك 🏆':'السؤال التالي ←';$('next').classList.remove('hidden')}function finish(){$('game').classList.add('hidden');$('final').classList.remove('hidden');$('fill').style.width='100%';$('count').textContent='انتهى التحدي';$('award').textContent=score===6?'🥇 وسام مهندسة المخاليط الذهبية':score>=4?'🥈 وسام مهندسة المخاليط المبدعة':'🌷 وسام الباحثة الصغيرة';$('result').textContent=`${score} / ٦`;$('message').textContent=score===6?'رائعة! أتقنتِ التحدي كاملًا وأثبتِّ مهاراتك في STEM.':score>=4?'أداء جميل! أنتِ في طريقك لإتقان علوم المخاليط.':'كل تجربة تزيد معرفتك. أعيدي المحاولة واكتشفي المزيد!'}$('next').onclick=()=>{if(i===5)finish();else{i++;render()}};function restart(){i=0;score=0;$('game').classList.remove('hidden');$('final').classList.add('hidden');render()}render();</script></body></html>
